services:
  nginx:
    image: nginx:alpine
    container_name: HuntPuk_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  redis:
    image: redis:alpine
    container_name: HuntPuk_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: HuntPuk_backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GGMAPI=${GGMAPI}
      - EMAIL=${EMAIL}
      - OTPPASS=${OTPPASS}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - BREVO_LOGIN=${BREVO_LOGIN}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY}
    volumes:
      - ./src:/app/src
    command: npm run dev
