# Rate limiting zone: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Ignore favicon requests
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # API Proxy with Rate Limiting
    location /api/ {
        # Apply rate limiting: allow burst of 20, delay requests if they exceed the rate
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy to the Node.js app container on port 3008
        proxy_pass http://app:3008;
        
        # Forward real IPs and host headers to Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
